<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 148" width="120" height="148" role="img" aria-label="Mura, the Tanit XR guide">
  <title>Mura</title>

  <defs>
    <linearGradient id="mura-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#e6dbc7"/>
    </linearGradient>
    <linearGradient id="mura-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4664a"/>
      <stop offset="100%" stop-color="#a8402c"/>
    </linearGradient>
  </defs>

  <!-- Crescent halo: the sign of Tanit behind the figure. -->
  <path d="M60 12a44 44 0 0 0 0 80 44 44 0 1 1 0-80z" fill="#f6e6c8" opacity="0.55"/>
  <circle cx="30" cy="96" r="3" fill="#f0dcb4" opacity="0.7"/>
  <circle cx="92" cy="72" r="2.5" fill="#f0dcb4" opacity="0.7"/>
  <circle cx="26" cy="60" r="2" fill="#f0dcb4" opacity="0.6"/>

  <!-- Body: the bell-shaped terracotta figurine. -->
  <path d="M60 74c-16 0-26 12-29 28-2 10-3 18-3 24h64c0-6-1-14-3-24-3-16-13-28-29-28z" fill="url(#mura-body)"/>

  <!-- Arms, stubby and outstretched. -->
  <path d="M33 92c-8 1-14 5-17 11-1 3 2 6 5 4 5-3 10-5 15-5z" fill="url(#mura-body)"/>
  <path d="M87 92c8 1 14 5 17 11 1 3-2 6-5 4-5-3-10-5-15-5z" fill="url(#mura-body)"/>

  <!-- Waist sash. -->
  <path d="M33 114c8 3 18 4 27 4s19-1 27-4c1 4 1 7 2 10-9 3-19 4-29 4s-20-1-29-4c1-3 1-6 2-10z" fill="#7d8c5b"/>

  <!-- Head. -->
  <ellipse cx="60" cy="54" rx="25" ry="23" fill="url(#mura-body)"/>

  <!-- Headdress cap. -->
  <path d="M35 46c0-13 11-21 25-21s25 8 25 21c-7-4-15-6-25-6s-18 2-25 6z" fill="url(#mura-cap)"/>
  <ellipse cx="60" cy="45" rx="25" ry="5" fill="#8f3524" opacity="0.35"/>

  <!-- Eyes. -->
  <circle cx="51" cy="56" r="6" fill="#1c1a17"/>
  <circle cx="69" cy="56" r="6" fill="#1c1a17"/>
  <circle cx="52.6" cy="54" r="1.8" fill="#fff" opacity="0.85"/>
  <circle cx="70.6" cy="54" r="1.8" fill="#fff" opacity="0.85"/>

  <!-- Earrings. -->
  <g stroke="#c9b28a" stroke-width="1.6" fill="none">
    <path d="M35 58v6"/>
    <path d="M85 58v6"/>
  </g>
  <circle cx="35" cy="66" r="2.4" fill="#c9b28a"/>
  <circle cx="85" cy="66" r="2.4" fill="#c9b28a"/>
</svg>
